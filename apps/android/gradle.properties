org.gradle.jvmargs=-Xmx2g -Dfile.encoding=UTF-8
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official

# Where the shell loads Ra's screens from. The Worker serves them, so the
# socket and API share the page's origin. The default is `wrangler dev` on this
# computer: run `adb reverse tcp:8787 tcp:8787` first (127.0.0.1 also counts as
# a secure origin for the microphone). For a deployed Worker, build with
# -Pra.url=https://<your-worker>/
ra.url=http://127.0.0.1:8787/
